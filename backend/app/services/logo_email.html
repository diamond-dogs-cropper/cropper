<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$subject</title>
</head>
<body style="margin:0;padding:0;background:#f5f7fc;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f7fc;">
<tr><td align="center" style="padding:32px 16px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;color:#27334b;">
  <tr><td style="padding:0 4px 20px;">
    <table role="presentation" cellpadding="0" cellspacing="0"><tr>
      <td style="width:28px;height:28px;border-radius:7px;background:#5268e8;"></td>
      <td style="padding-left:10px;font-size:17px;font-weight:600;color:#27334b;">$brand</td>
    </tr></table>
  </td></tr>
  <tr><td style="background:#ffffff;border:1px solid #dfe5f0;border-radius:14px;padding:32px;">
    <p style="margin:0 0 8px;font-size:13px;color:#687892;">$kicker</p>
    <h1 style="margin:0 0 20px;font-size:22px;line-height:30px;font-weight:600;color:#27334b;">$company</h1>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 20px;background:#f5f7fc;border-radius:10px;">
      <tr><td align="center" style="padding:20px 16px;">
        <img src="cid:$image_cid" width="$image_width" height="$image_height" alt="Логотип $company" style="display:block;border:1px solid #c9d2e6;">
      </td></tr>
    </table>
    $progress
    <table role="presentation" cellpadding="0" cellspacing="0"><tr>
      <td style="border-radius:9px;background:#5268e8;">
        <a href="$link" style="display:inline-block;padding:13px 28px;font-size:15px;font-weight:600;color:#ffffff;text-decoration:none;">Открыть шаблон</a>
      </td>
    </tr></table>
  </td></tr>
  <tr><td style="padding:20px 4px 0;font-size:12px;line-height:18px;color:#8a97ad;">Шаблон «$name». Отключить такие письма можно на странице шаблона.</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
