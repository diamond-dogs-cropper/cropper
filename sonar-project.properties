sonar.projectKey=cropper
sonar.projectName=cropper
sonar.sourceEncoding=UTF-8
sonar.sources=.github,backend,docker-compose.yml,frontend
sonar.scm.provider=git
sonar.sca.enabled=true
sonar.exclusions=**/node_modules/**,**/.venv/**,**/venv/**,**/dist/**,**/build/**,**/target/**,**/obj/**,**/__pycache__/**,**/*.egg-info/**,**/.scannerwork/**,**/.sonar-reports/**,**/*.min.*
sonar.python.version=3.12,3.13,3.14
sonar.python.coverage.reportPaths=.sonar-reports/coverage*.xml
sonar.python.ruff.reportPaths=.sonar-reports/ruff.json
sonar.python.pylint.reportPaths=.sonar-reports/pylint.txt
sonar.python.bandit.reportPaths=.sonar-reports/bandit.json
sonar.python.mypy.reportPaths=.sonar-reports/mypy.txt
sonar.test.inclusions=**/*.test.*,**/*.spec.*
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.eslint.reportPaths=.sonar-reports/eslint.json
sonar.css.stylelint.reportPaths=.sonar-reports/stylelint.json

sonar.issue.ignore.multicriteria=docstring,tsheader,htmlheader,alembic,globals,png,ternary,jsxfn,emailstyle,emailtable,emailattr,emaillines,emaili18n,emailicon,worker,devdb,dockerpin
sonar.issue.ignore.multicriteria.docstring.ruleKey=python:S1720
sonar.issue.ignore.multicriteria.docstring.resourceKey=**/*.py
sonar.issue.ignore.multicriteria.tsheader.ruleKey=typescript:S1451
sonar.issue.ignore.multicriteria.tsheader.resourceKey=**/*
sonar.issue.ignore.multicriteria.htmlheader.ruleKey=Web:HeaderCheck
sonar.issue.ignore.multicriteria.htmlheader.resourceKey=**/*
sonar.issue.ignore.multicriteria.alembic.ruleKey=python:S1578
sonar.issue.ignore.multicriteria.alembic.resourceKey=backend/migrations/versions/**
sonar.issue.ignore.multicriteria.globals.ruleKey=creedengo-python:GCI4
sonar.issue.ignore.multicriteria.globals.resourceKey=backend/**
sonar.issue.ignore.multicriteria.png.ruleKey=creedengo-python:GCI203
sonar.issue.ignore.multicriteria.png.resourceKey=backend/**
sonar.issue.ignore.multicriteria.ternary.ruleKey=typescript:S1774
sonar.issue.ignore.multicriteria.ternary.resourceKey=**/*
sonar.issue.ignore.multicriteria.jsxfn.ruleKey=typescript:S6480
sonar.issue.ignore.multicriteria.jsxfn.resourceKey=**/*.tsx
sonar.issue.ignore.multicriteria.emailstyle.ruleKey=Web:InlineStyleCheck
sonar.issue.ignore.multicriteria.emailstyle.resourceKey=backend/app/services/invite_email.html
sonar.issue.ignore.multicriteria.emailtable.ruleKey=Web:S5257
sonar.issue.ignore.multicriteria.emailtable.resourceKey=backend/app/services/invite_email.html
sonar.issue.ignore.multicriteria.emailattr.ruleKey=Web:S1827
sonar.issue.ignore.multicriteria.emailattr.resourceKey=backend/app/services/invite_email.html
sonar.issue.ignore.multicriteria.emaillines.ruleKey=Web:MaxLineLengthCheck
sonar.issue.ignore.multicriteria.emaillines.resourceKey=backend/app/services/invite_email.html
sonar.issue.ignore.multicriteria.emaili18n.ruleKey=Web:InternationalizationCheck
sonar.issue.ignore.multicriteria.emaili18n.resourceKey=backend/app/services/invite_email.html
sonar.issue.ignore.multicriteria.emailicon.ruleKey=Web:PageWithoutFaviconCheck
sonar.issue.ignore.multicriteria.emailicon.resourceKey=backend/app/services/invite_email.html
sonar.issue.ignore.multicriteria.worker.ruleKey=typescript:S2819
sonar.issue.ignore.multicriteria.worker.resourceKey=frontend/src/features/templates/lib/backgroundWorker.ts
sonar.issue.ignore.multicriteria.devdb.ruleKey=secrets:S6698
sonar.issue.ignore.multicriteria.devdb.resourceKey=backend/.env.example
sonar.issue.ignore.multicriteria.dockerpin.ruleKey=docker:S8431
sonar.issue.ignore.multicriteria.dockerpin.resourceKey=**/Dockerfile
