sonar.projectKey=cropper
sonar.projectName=cropper
sonar.sourceEncoding=UTF-8
sonar.sources=.github,backend,docker-compose.yml,frontend
sonar.scm.provider=git
sonar.sca.enabled=true
sonar.exclusions=**/node_modules/**,**/.venv/**,**/venv/**,**/dist/**,**/build/**,**/target/**,**/obj/**,**/__pycache__/**,**/*.egg-info/**,**/.scannerwork/**,**/.sonar-reports/**,**/*.min.*
sonar.python.version=3.12,3.13,3.14
sonar.python.coverage.reportPaths=.sonar-reports/coverage*.xml
sonar.python.ruff.reportPaths=.sonar-reports/ruff.json
sonar.python.pylint.reportPaths=.sonar-reports/pylint.txt
sonar.python.bandit.reportPaths=.sonar-reports/bandit.json
sonar.python.mypy.reportPaths=.sonar-reports/mypy.txt
sonar.test.inclusions=**/*.test.*,**/*.spec.*
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.eslint.reportPaths=.sonar-reports/eslint.json
sonar.css.stylelint.reportPaths=.sonar-reports/stylelint.json
